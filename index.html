<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>choice-search</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
form { display: flex; gap: .5rem; }
input { flex: 1; padding: .5rem; font-size: 1rem; }
button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
.hint { color: #555; font-size: .9rem; }
.status { margin-top: 1rem; }
.results { margin-top: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.card { border: 1px solid #ddd; border-radius: 8px; padding: .75rem; display: flex; flex-direction: column; gap: .4rem; }
.card img { width: 100%; height: 160px; object-fit: contain; background: #f7f7f7; border-radius: 4px; }
.card .title { font-size: .9rem; }
.card .price { font-weight: bold; }
.card .meta { color: #555; font-size: .8rem; }
.badges { display: flex; gap: .4rem; flex-wrap: wrap; }
.badge { font-size: .75rem; background: #eef; border-radius: 4px; padding: .1rem .4rem; }
.error a { display: inline-block; margin-top: .5rem; }
</style>
</head>
<body>
<h1>choice-search</h1>
<form id="f">
<input id="q" type="search" placeholder="Search (e.g. esp32)" required autofocus>
<button type="submit">Search</button>
</form>
<p class="hint">Single items only; ads, bundle links and bundle / lot / pack titles are excluded. Prices in USD (US listing — final price on product page).</p>
<noscript><p><a href="https://fr.aliexpress.com/w/wholesale-esp32.html?SearchText=esp32&amp;g=y">Example: "esp32" search on AliExpress</a></p></noscript>
<div class="status" id="status" role="status" aria-live="polite" hidden></div>
<div class="results" id="results" aria-live="polite"></div>
<script>
const BASE = 'https://fr.aliexpress.com/w';
const JINA = 'https://r.jina.ai/';
const f = document.getElementById('f');
const q = document.getElementById('q');
const status = document.getElementById('status');
const results = document.getElementById('results');

// Same bundle-pack title filter as before (packs without a clear unit price).
const BUNDLE_RE = /bundle|\blot\b|\blots\b|x\s?\d+\s?(pcs|pieces|pack)|\d+\s?(pcs|pieces)\b|pack\s?deal|set\s?of|wholesale\s?lot/i;

function searchUrl(query) {
  const slug = query.trim().toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).join('-') || 'products';
  const params = new URLSearchParams({ SearchText: query, g: 'y' });
  return BASE + '/wholesale-' + slug + '.html?' + params.toString();
}

// Sponsored placement: Jina keeps the tracking parameter in the product URL.
function isAd(url) {
  return url.includes('aem_p4p_detail');
}

// Most Jina lines show no shipping info at all, so a missing mention means
// "unknown", not "paid". Only an explicit paid-shipping price excludes the item.
function hasPaidShipping(line) {
  return /Shipping:\s*\$|\+\s*\$\d[\d.]*\s*shipping/i.test(line);
}

// Jina mirrors the aliexpress.US page: the "$X" in the markdown is often the
// "welcome deal" (new-shopper) price, while pdp_npi in the product URL carries
// both amounts: pdp_npi=...!USD!<ORIG>!<SALE>... (URL-encoded as %21, %40).
// ORIG (first) is the regular price, SALE (second) the new-shopper one, so the
// true price is ORIG, never the markdown "$".
function priceFromPdpNpi(url) {
  let s = url;
  try { s = decodeURIComponent(url); } catch { /* keep raw */ }
  const m = /pdp_npi=[^!\s]*!USD!([\d.]+)!([\d.]+)/.exec(s);
  if (!m) return null;
  const orig = parseFloat(m[1]);
  const sale = parseFloat(m[2]);
  if (!Number.isFinite(orig)) return null;
  return { price: Math.round(orig * 100) / 100, welcome: Number.isFinite(sale) && sale < orig };
}

// Soft deliverability filter: exclude only explicit not-shipping mentions.
// A missing shipping mention means "unknown", not "undeliverable".
const NOT_SHIP_RE = /does not ship|not deliver|not available in/i;

// One Jina Reader markdown line per product:
// [![Image N: TITLE](FIRST_AE_PIC_URL) ... ### TITLE $PRICE ... META ...](PRODUCT_URL)
function parseProductLine(line) {
  const links = [...line.matchAll(/\]\((https:\/\/[^)]+)\)/g)].map((m) => m[1]);
  if (!links.length) return null;
  const productUrl = links[links.length - 1]; // last link = the product page
  if (isAd(productUrl)) return null;
  if (productUrl.includes('BundleDeals')) return null; // belt and braces: bundle links are never directly buyable
  const idMatch = /\/item\/(\d+)\.html/.exec(productUrl);
  if (!idMatch) return null;
  const titleMatch = /###\s*([^$]+?)\s*\$/.exec(line);
  if (!titleMatch) return null;
  const title = titleMatch[1].trim();
  if (!title || BUNDLE_RE.test(title)) return null;
  const afterTitle = line.slice(titleMatch.index + titleMatch[0].length - 1);
  const priceMatch = /\$([\d.]+)/.exec(afterTitle);
  if (!priceMatch) return null;
  if (NOT_SHIP_RE.test(line)) return null;
  // True price first: ORIG from pdp_npi; markdown "$" fallback flagged as a possible welcome price.
  const npi = priceFromPdpNpi(productUrl);
  const price = npi ? npi.price : parseFloat(priceMatch[1]);
  if (!Number.isFinite(price)) return null;
  if (hasPaidShipping(line)) return null;
  const imgMatch = /https:\/\/ae-pic-[^\s)]+/.exec(line); // first ae-pic URL = product image
  const rest = afterTitle.slice(priceMatch.index + priceMatch[0].length);
  // Rating: first decimal NOT starting right after "$" (skips $1.09 / $5.00 style prices).
  const ratingMatch = /(?<!\$)(\d\.\d)/.exec(rest);
  const soldMatch = /([\d,+]+\s*sold|\d+\s*sold)/i.exec(rest);
  const item = {
    id: idMatch[1],
    title,
    price: Math.round(price * 100) / 100,
    currency: 'USD', // listings serve USD prices
    link: 'https://www.aliexpress.com/item/' + idMatch[1] + '.html',
    welcomePrice: !npi,
    choice: /choice/i.test(line),
    freeShipping: /free shipping/i.test(line)
  };
  if (imgMatch) item.image = imgMatch[0];
  if (ratingMatch) item.rating = parseFloat(ratingMatch[1]);
  if (soldMatch) {
    const n = parseInt(soldMatch[1].replace(/[^\d]/g, ''), 10);
    if (Number.isFinite(n)) item.sales = n;
  }
  return item;
}

function parseJinaMarkdown(text) {
  const seen = new Set();
  const out = [];
  for (const raw of String(text).split('\n')) {
    const line = raw.trim();
    if (!line.includes('###') || !line.includes('](')) continue;
    const item = parseProductLine(line);
    if (item && !seen.has(item.id)) {
      seen.add(item.id);
      out.push(item);
      if (out.length >= 30) break;
    }
  }
  return out;
}

function setStatus(text) {
  status.hidden = !text;
  status.textContent = text || '';
}

function showFallback(query) {
  const url = searchUrl(query);
  results.innerHTML = '';
  setStatus('');
  const div = document.createElement('div');
  div.className = 'error';
  const p = document.createElement('p');
  p.textContent = 'Search is temporarily unavailable (the reader service or AliExpress blocked the request). No results were invented.';
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = 'Open search on AliExpress';
  div.appendChild(p);
  div.appendChild(a);
  results.appendChild(div);
}

function render(items) {
  results.innerHTML = '';
  for (const it of items) {
    const card = document.createElement('article');
    card.className = 'card';
    if (it.image) {
      const img = document.createElement('img');
      img.src = it.image;
      img.alt = '';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', () => img.remove());
      card.appendChild(img);
    }
    const a = document.createElement('a');
    a.href = it.link;
    a.target = '_blank';
    a.rel = 'noopener';
    a.className = 'title';
    a.textContent = it.title;
    const price = document.createElement('div');
    price.className = 'price';
    price.textContent = (it.welcomePrice ? 'from ' : '') + it.price.toFixed(2) + ' ' + it.currency;
    const meta = document.createElement('div');
    meta.className = 'meta';
    if (it.rating) bits.push('Rating: ' + it.rating);
    if (it.sales !== undefined) bits.push(it.sales + ' sold');
    if (it.welcomePrice) bits.push('New-shopper price, check listing');
    meta.textContent = bits.join(' · ');
    const badges = document.createElement('div');
    badges.className = 'badges';
    if (it.choice) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = 'Choice';
      badges.appendChild(b);
    }
    if (it.freeShipping) {
      const fs = document.createElement('span');
      fs.className = 'badge';
      fs.textContent = 'Free shipping';
      badges.appendChild(fs);
    }
    card.appendChild(a);
    card.appendChild(price);
    if (meta.textContent) card.appendChild(meta);
    if (badges.children.length) card.appendChild(badges);
    results.appendChild(card);
  }
}

async function runSearch(query) {
  setStatus('Searching…');
  results.innerHTML = '';
  const url = searchUrl(query);
  let text = '';
  try {
    const res = await fetch(JINA + url, { headers: { Accept: 'text/plain' } });
    if (!res.ok) throw new Error('reader status ' + res.status);
    text = await res.text();
    if (!text) throw new Error('empty reader response');
  } catch {
    showFallback(query);
    return;
  }
  let items = [];
  try {
    items = parseJinaMarkdown(text);
  } catch {
    items = [];
  }
  if (!items.length) {
    showFallback(query);
    return;
  }
  setStatus(items.length + ' result(s) for "' + query + '"');
  render(items);
}

f.addEventListener('submit', (e) => {
  e.preventDefault();
  const query = q.value.trim();
  if (!query) return;
  runSearch(query);
});
</script>
</body>
</html>
